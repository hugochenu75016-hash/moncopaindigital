<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Favicon Mon Copain Digital -->
<link rel="icon" href="/favicons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicons/favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
<link rel="manifest" href="/favicons/site.webmanifest">
<meta name="theme-color" content="#F3852B">
<title>Votre bon cadeau · Mon Copain Digital</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&display=swap" rel="stylesheet">
<style>
  /* Bon cadeau à imprimer : même bon que carte-cadeau.html, rempli avec le vrai code (fonction bon-cadeau) */
  :root{--ink:#0a0a0a;--paper:#f5f5f5;--or:#F3852B;--orf:#C7620E;--blue:#6EC1F0;--vert:#1f7a43;--pad:clamp(16px,2.2vw,32px)}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--or);color:#fff;font-family:Archivo,system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  .disp{font-stretch:62%;font-weight:900;text-transform:uppercase;line-height:.84;letter-spacing:-.005em;margin:0}
  .lbl{display:inline-block;font-stretch:62%;font-weight:800;text-transform:uppercase;font-size:14px;letter-spacing:.03em}
  .top{display:flex;align-items:center;gap:20px;padding:18px var(--pad)}
  .logo{font-stretch:62%;font-weight:900;font-size:24px;text-transform:uppercase;line-height:1}
  .zone{flex:1;display:grid;place-items:center;align-content:center;gap:26px;padding:20px var(--pad) 40px}
  .bon{width:min(820px,100%);background:#fff;color:var(--ink);display:grid;grid-template-columns:1fr auto;box-shadow:0 30px 60px rgba(120,50,0,.3)}
  .bon .g{padding:30px 34px;border-right:3px dashed #e3e3e3;position:relative;min-width:0}
  .bon .g::before,.bon .g::after{content:"";position:absolute;right:-16px;width:30px;height:30px;border-radius:50%;background:var(--or)}
  .bon .g::before{top:-15px}.bon .g::after{bottom:-15px}
  .bon .lbl{color:var(--or)}
  .bon h1{font-size:clamp(40px,6vw,76px);color:var(--blue);margin:10px 0 12px;overflow-wrap:anywhere}
  .bon .formule{margin:0;font-weight:600;color:#444;font-size:17px}
  .bon .mot{margin:14px 0 0;font-style:italic;color:#555;font-size:16px}
  .bon .mot:empty{display:none}
  .bon .d{padding:30px 26px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center;min-width:230px}
  .bon .seances{font-stretch:62%;font-weight:900;font-size:58px;color:var(--or);line-height:.85}
  .bon .seances small{display:block;font-size:16px;letter-spacing:.04em}
  .bon .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;letter-spacing:.12em;border:2px dashed var(--ink);padding:8px 12px;font-size:17px;white-space:nowrap}
  .bon .valid{font-size:13px;color:#666;font-weight:600}
  .infos{max-width:820px;text-align:center;font-weight:600;margin:0}
  .actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:15px 24px;border:1px solid #fff;font-stretch:62%;font-weight:800;text-transform:uppercase;font-size:17px;letter-spacing:.02em;cursor:pointer;background:transparent;color:#fff;font-family:inherit}
  .btn.vert{background:var(--vert);border-color:var(--vert)}
  .btn:hover{background:var(--ink);border-color:var(--ink)}
  .etat{font-weight:700;font-size:18px;text-align:center;max-width:520px}
  [hidden]{display:none!important}
  @media (max-width:700px){.bon{grid-template-columns:1fr}.bon .g{border-right:0;border-bottom:3px dashed #e3e3e3;padding:24px}.bon .g::before,.bon .g::after{display:none}.bon .d{min-width:0}}
  /* Impression : seulement le bon, en couleurs */
  @media print{
    @page{margin:12mm}
    body{background:#fff;min-height:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .top,.actions,.infos{display:none!important}
    .zone{padding:0}
    .bon{box-shadow:none;border:2px solid #e3e3e3;width:100%}
    .bon .g::before,.bon .g::after{background:#fff;border:2px solid #e3e3e3}
  }
</style>
</head>
<body>
<div id="door-tx" class="loading" data-auto aria-hidden="true"></div>
<script src="js/intro-tx.js?v=2"></script>
<header class="top"><a class="logo" href="index.html" aria-label="Mon Copain Digital · accueil">Mon Copain Digital</a></header>
<main class="zone">
  <p class="etat" id="etat">Chargement de votre bon…</p>
  <div class="bon" id="bon" hidden>
    <div class="g">
      <span class="lbl">Bon cadeau · Mon Copain Digital</span>
      <h1 class="disp" id="b-pour"></h1>
      <p class="formule" id="b-formule"></p>
      <p class="mot" id="b-mot"></p>
    </div>
    <div class="d">
      <div class="seances" id="b-seances"></div>
      <div class="code" id="b-code"></div>
      <div class="valid" id="b-valid"></div>
    </div>
  </div>
  <p class="infos" id="infos" hidden>Pour réserver : répondez à l’e-mail du bon ou prenez rendez-vous en indiquant le code. À domicile en Île-de-France ou en visio.</p>
  <div class="actions" id="actions" hidden>
    <button type="button" class="btn vert" id="imprimer">Imprimer le bon</button>
    <a class="btn" href="rendez-vous.html">Prendre rendez-vous</a>
  </div>
</main>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var code = (new URLSearchParams(location.search).get('code') || '').trim().toUpperCase();
  function erreur(t){ $('etat').textContent = t; }
  if (!/^MCD-[2-9A-HJKMNP-Z]{4}-[2-9A-HJKMNP-Z]{4}$/.test(code)) { erreur('Ce lien de bon cadeau est incomplet. Ouvrez le lien de l’e-mail, ou écrivez-nous à contact@moncopaindigital.fr.'); return; }
  fetch('https://fskrgqkrpgxvypcwbfwm.supabase.co/functions/v1/bon-cadeau?code=' + encodeURIComponent(code))
    .then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; }); })
    .then(function(x){
      if (!x.ok) { erreur(x.d && x.d.error === 'Bon introuvable.' ? 'Ce bon cadeau est introuvable. Vérifiez le lien, ou écrivez-nous à contact@moncopaindigital.fr.' : 'Impossible d’afficher le bon pour le moment. Réessayez dans un instant.'); return; }
      var b = x.d, n = b.seances;
      $('b-pour').textContent = b.pour ? 'Pour ' + b.pour : 'Bon cadeau';
      $('b-formule').textContent = (n > 1 ? n + ' séances' : 'Une séance') + ' d’accompagnement numérique, à domicile en Île-de-France ou en visio' + (b.de ? ', de la part de ' + b.de : '') + '.';
      $('b-mot').textContent = b.mot ? '« ' + b.mot + ' »' : '';
      $('b-seances').innerHTML = ''; $('b-seances').append(String(n)); var s = document.createElement('small'); s.textContent = n > 1 ? 'séances' : 'séance'; $('b-seances').append(s);
      $('b-code').textContent = b.code;
      $('b-valid').textContent = b.utilise_le ? 'Bon déjà utilisé' : 'Valable jusqu’au ' + new Date(b.valable_jusqu).toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
      $('etat').hidden = true; $('bon').hidden = false; $('infos').hidden = false; $('actions').hidden = false;
      document.title = 'Bon cadeau' + (b.pour ? ' pour ' + b.pour : '') + ' · Mon Copain Digital';
    })
    .catch(function(){ erreur('Impossible d’afficher le bon pour le moment. Réessayez dans un instant.'); });
  $('imprimer').onclick = function(){ window.print(); };
})();
</script>
</body>
</html>
