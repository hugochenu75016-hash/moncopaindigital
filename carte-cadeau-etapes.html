<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Favicon Mon Copain Digital -->
<link rel="icon" href="/favicons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicons/favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
<link rel="manifest" href="/favicons/site.webmanifest">
<meta name="theme-color" content="#6EC1F0">
<title>Offrir un bon cadeau · Mon Copain Digital</title>
<meta name="description" content="Composez votre bon cadeau en 3 étapes : la formule, pour qui, comment l’offrir. Paiement sécurisé.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://moncopaindigital.fr/carte-cadeau.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&display=swap" rel="stylesheet">
<style>
  /* Charte commune (même charte qu'audit-gratuit.html et Nos offres) */
/* Charte commune des 3 maquettes « Carte cadeau » (même charte qu'audit-gratuit.html et Nos offres) */
:root{--ink:#0a0a0a;--paper:#f5f5f5;--or:#F3852B;--or2:#FF9C46;--orf:#C7620E;--blue:#6EC1F0;--blued:#4AA8DE;--pad:clamp(16px,2.2vw,32px)}
*{box-sizing:border-box}
html,body{margin:0}
html{overflow-x:hidden}
body{background:var(--blue);color:#fff;font-family:Archivo,system-ui,sans-serif;font-size:16px;line-height:1.45;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
.disp{font-stretch:62%;font-weight:900;text-transform:uppercase;line-height:.84;letter-spacing:-.005em;margin:0}
.disp em{font-style:italic;font-weight:800;color:var(--or)}
.lbl{display:inline-block;font-stretch:62%;font-weight:800;text-transform:uppercase;font-size:15px;letter-spacing:.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:16px 22px;border:1px solid currentColor;font-stretch:62%;font-weight:800;text-transform:uppercase;font-size:17px;letter-spacing:.02em;cursor:pointer;background:transparent;transition:background .25s,color .25s,border-color .25s}
.btn svg{width:18px;height:18px}
.btn.fill{background:var(--or);border-color:var(--or);color:#fff}
.btn.fill:hover{background:var(--ink);border-color:var(--ink)}
.top{display:flex;align-items:center;gap:20px;padding:18px var(--pad)}
.logo{font-stretch:62%;font-weight:900;font-size:26px;text-transform:uppercase;letter-spacing:-.01em;line-height:1}
.cta-top{margin-left:auto;display:inline-flex;border:1px solid currentColor;border-radius:999px;padding:8px 16px;font-stretch:62%;font-weight:800;text-transform:uppercase;font-size:14px;white-space:nowrap}
@media (max-width:420px){.logo{font-size:19px}.cta-top{padding:7px 11px;font-size:12px}}
.marshall{filter:drop-shadow(0 18px 22px rgba(0,40,70,.28))}
/* Choix de la formule */
.choix{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choix label{position:relative;cursor:pointer}
.choix input{position:absolute;opacity:0}
.choix .tuile{display:block;border:2px solid var(--blue);background:#fff;color:var(--blue);padding:14px 8px;text-align:center;transition:background .2s,color .2s}
.choix .tuile b{display:block;font-stretch:62%;font-weight:900;font-size:36px;line-height:.9;color:var(--or)}
.choix .tuile span{font-stretch:62%;font-weight:800;text-transform:uppercase;font-size:14px}
.choix input:checked+.tuile{background:var(--blue);color:#fff}
.choix input:checked+.tuile b{color:#fff}
.choix input:focus-visible+.tuile{outline:3px solid var(--or);outline-offset:2px}
@media (max-width:420px){.choix .tuile b{font-size:28px}}
/* Champs */
.champ{display:flex;flex-direction:column;gap:6px}
.champ span{font-stretch:62%;font-weight:800;text-transform:uppercase;font-size:14px}
.champ input,.champ textarea{border:2px solid var(--blue);background:#fff;color:var(--ink);padding:12px 14px;font-size:16px;font-weight:600;width:100%}
.champ textarea{min-height:92px;resize:vertical}
.champ input:focus,.champ textarea:focus{outline:none;border-color:var(--or)}

  /* B. Un parcours en 3 étapes, une question à la fois, Marshall qui accompagne */
  .cadre{min-height:calc(100svh - 76px);display:grid;grid-template-columns:.8fr 1.2fr;align-items:end;gap:24px;padding:0 var(--pad)}
  .cote{align-self:stretch;display:flex;flex-direction:column;justify-content:space-between;padding:20px 0 0}
  .cote h1{font-size:clamp(52px,7vw,120px)}
  .cote .bulle{background:#fff;color:var(--ink);padding:16px 18px;font-weight:700;max-width:340px;position:relative;margin:24px 0}
  .cote .bulle::after{content:"";position:absolute;left:40px;bottom:-14px;border:14px solid transparent;border-top-color:#fff;border-bottom:0}
  .cote .marshall{height:min(48svh,440px);width:auto}
  .panneau{background:#fff;color:var(--ink);padding:clamp(24px,3.4vw,48px);margin-bottom:var(--pad);align-self:center}
  .progres{display:flex;gap:6px;margin-bottom:26px}
  .progres i{flex:1;height:6px;background:var(--paper)}
  .progres i.on{background:var(--or)}
  .etape{display:none}
  .etape.on{display:block;animation:entre .35s both}
  @keyframes entre{from{opacity:0;transform:translateX(16px)}}
  .etape .lbl{color:var(--or)}
  .etape h2{font-size:clamp(40px,4.6vw,72px);color:var(--blue);margin:8px 0 22px}
  .etape .grille{display:grid;gap:14px}
  .options{display:grid;gap:10px}
  .options label{cursor:pointer;position:relative}
  .options input{position:absolute;opacity:0}
  .options .o{display:flex;justify-content:space-between;align-items:center;gap:12px;border:2px solid var(--blue);padding:16px 18px;transition:background .2s,color .2s}
  .options .o b{font-stretch:62%;font-weight:900;text-transform:uppercase;font-size:24px;line-height:1}
  .options .o small{display:block;font-weight:600;color:#666;font-size:14px}
  .options .o strong{font-stretch:62%;font-weight:900;font-size:40px;color:var(--or);line-height:.9;white-space:nowrap}
  .options input:checked+.o{background:var(--blue);color:#fff}
  .options input:checked+.o small,.options input:checked+.o strong{color:#fff}
  .options input:focus-visible+.o{outline:3px solid var(--or);outline-offset:2px}
  .pied{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
  .pied .btn.retour{color:var(--blue)}
  .recap{background:var(--paper);padding:16px 18px;font-weight:700;display:grid;gap:4px}
  .recap span{color:#666;font-weight:600}
  @media (max-width:900px){.cadre{grid-template-columns:1fr;align-items:start}.cote{order:2;flex-direction:row;align-items:flex-end}.cote h1{display:none}.cote .marshall{height:200px}.cote .bulle{margin:0 0 20px}.panneau{margin-top:10px}}
  @media (max-width:420px){.options .o b{font-size:20px}.options .o strong{font-size:30px}}
</style>
</head>
<body>
<div id="door-tx" class="loading" data-auto aria-hidden="true"></div>
<script src="js/intro-tx.js?v=2"></script>
<header class="top"><a class="logo" href="index.html" aria-label="Mon Copain Digital · accueil">Mon Copain Digital</a><a class="cta-top" href="rendez-vous.html">Audit gratuit</a></header>
<main class="cadre">
  <div class="cote">
    <h1 class="disp">Un cadeau<br><em>utile</em><br>pour Noël</h1>
    <div>
      <div class="bulle" id="bulle">On prépare un joli cadeau ensemble ? Ça prend une minute !</div>
      <img class="marshall" src="images/marshall-cadeau-ecrit.webp" alt="Marshall écrit une carte">
    </div>
  </div>
  <form class="panneau" onsubmit="event.preventDefault()">
    <div class="progres"><i class="on"></i><i></i><i></i></div>

    <div class="etape on" data-bulle="On prépare un joli cadeau ensemble ? Ça prend une minute !">
      <span class="lbl">Étape 1 sur 3</span>
      <h2 class="disp">Que voulez-vous <em>offrir ?</em></h2>
      <div class="options">
        <label><input type="radio" name="f" value="49" data-n="1 séance"><span class="o"><span><b>1 séance</b><small>Pour un premier coup de pouce</small></span><strong>49 €</strong></span></label>
        <label><input type="radio" name="f" value="135" data-n="3 séances" checked><span class="o"><span><b>3 séances</b><small>Le plus offert · 45 € la séance</small></span><strong>135 €</strong></span></label>
        <label><input type="radio" name="f" value="210" data-n="5 séances"><span class="o"><span><b>5 séances</b><small>Pour vraiment prendre le pli · 42 € la séance</small></span><strong>210 €</strong></span></label>
      </div>
    </div>

    <div class="etape" data-bulle="Un petit mot, ça fait toujours plaisir. Je l'écris sur la carte.">
      <span class="lbl">Étape 2 sur 3</span>
      <h2 class="disp">Pour <em>qui ?</em></h2>
      <div class="grille">
        <label class="champ"><span>Son prénom</span><input id="i-pour" maxlength="30" placeholder="Ex. Papa" autocomplete="off"></label>
        <label class="champ"><span>De la part de</span><input id="i-de" maxlength="40" placeholder="Ex. Thomas et Inès" autocomplete="off"></label>
        <label class="champ"><span>Votre petit mot</span><textarea id="i-mot" maxlength="140" placeholder="Ex. Pour que tu puisses enfin nous appeler en visio !"></textarea></label>
      </div>
    </div>

    <div class="etape" data-bulle="Dernière étape ! Imprimée ou par e-mail, c'est vous qui voyez.">
      <span class="lbl">Étape 3 sur 3</span>
      <h2 class="disp">On l'envoie <em>comment ?</em></h2>
      <div class="options">
        <label><input type="radio" name="e" value="imprime" checked><span class="o"><span><b>Je l'imprime</b><small>Vous recevez le bon par e-mail en quelques minutes, prêt à imprimer et à glisser sous le sapin</small></span></span></label>
        <label><input type="radio" name="e" value="email24"><span class="o"><span><b>Par e-mail, le jour J</b><small>On l'envoie au bénéficiaire le 24 décembre au matin</small></span></span></label>
      </div>
      <label class="champ" id="champ-dest" hidden style="margin-top:12px"><span>Son adresse e-mail</span><input id="i-dest" type="email" maxlength="120" placeholder="prenom@exemple.fr" autocomplete="off"></label>
      <div class="recap" style="margin-top:16px" id="recap"></div>
    </div>

    <div class="pied">
      <button class="btn retour" type="button" id="prec" hidden>Retour</button>
      <button class="btn fill" type="button" id="suiv" style="margin-left:auto">Continuer <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
    </div>
  </form>
</main>
<script>
(function(){
  var et = document.querySelectorAll('.etape'), barres = document.querySelectorAll('.progres i'), i = 0;
  var prec = document.getElementById('prec'), suiv = document.getElementById('suiv');
  function voir(n){
    i = Math.max(0, Math.min(et.length - 1, n));
    et.forEach(function(e, k){ e.classList.toggle('on', k === i); });
    barres.forEach(function(b, k){ b.classList.toggle('on', k <= i); });
    document.getElementById('bulle').textContent = et[i].dataset.bulle;
    prec.hidden = i === 0;
    var f = document.querySelector('input[name=f]:checked');
    suiv.firstChild.textContent = i === et.length - 1 ? 'Payer ' + f.value + ' € ' : 'Continuer ';
    var r = document.getElementById('recap'); r.textContent = '';
    var l1 = document.createElement('span'); l1.textContent = 'Votre cadeau';
    var l2 = document.createElement('div'); l2.textContent = f.dataset.n + ' pour ' + (document.getElementById('i-pour').value.trim() || '…') + ' · ' + f.value + ' €';
    var l3 = document.createElement('span'); l3.textContent = 'Valable 12 mois, à domicile en Île-de-France ou en visio.';
    r.append(l1, l2, l3);
  }
  /* Arrivée depuis carte-cadeau.html : formule et prénom déjà choisis */
  var choix = {};
  try { choix = JSON.parse(sessionStorage.getItem('mcd-cadeau') || '{}'); } catch (e) {}
  var q = new URLSearchParams(location.search);
  var prix = q.get('prix') || choix.prix, pour = q.get('pour') || choix.pour;
  var radio = prix && document.querySelector('input[name=f][value="' + prix.replace(/[^0-9]/g, '') + '"]');
  if (radio) radio.checked = true;
  if (pour) document.getElementById('i-pour').value = pour;
  document.querySelectorAll('input[name=f]').forEach(function(r){ r.addEventListener('change', function(){ voir(i); }); });
  prec.onclick = function(){ voir(i - 1); };
  var OFFRE = { 49:'seance', 135:'pack3', 210:'pack5' };
  var dest = document.getElementById('i-dest'), champDest = document.getElementById('champ-dest');
  document.querySelectorAll('input[name=e]').forEach(function(r){ r.addEventListener('change', function(){ champDest.hidden = r.value !== 'email24' || !r.checked; }); });
  suiv.onclick = function(){
    if (i === 1 && !document.getElementById('i-pour').value.trim()) { document.getElementById('i-pour').focus(); return; }
    if (i < et.length - 1) { voir(i + 1); return; }
    var f = document.querySelector('input[name=f]:checked'), envoi = document.querySelector('input[name=e]:checked').value;
    if (envoi === 'email24' && !/^\S+@\S+\.\S+$/.test(dest.value.trim())) { dest.focus(); dest.style.borderColor = 'var(--or)'; return; }
    var p = new URLSearchParams({ offre: OFFRE[f.value], cadeau: '1', pour: document.getElementById('i-pour').value.trim(),
      de: document.getElementById('i-de').value.trim(), mot: document.getElementById('i-mot').value.trim(), envoi: envoi });
    if (envoi === 'email24') p.set('dest', dest.value.trim());
    var th = q.get('theme'); if (/^(noel|anniversaire|fete-meres|fete-peres|merci)$/.test(th || '')) p.set('theme', th);
    location.href = 'paiement.html?' + p.toString();
  };
  voir(0);
})();
</script>
</body>
</html>
